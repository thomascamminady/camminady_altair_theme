[project]
name = "camminady_altair_theme"
version = "0.2.0"
description = "A minimal Altair theme with muted gray text, dashed grid lines and horizontal axis titles."
authors = [
    { name = "Thomas Camminady", email = "0milieux_member@icloud.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["altair", "vega-lite", "theme", "visualization", "charts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/thomascamminady/camminady_altair_theme"
Documentation = "https://camminady.dev/camminady_altair_theme/"
Repository = "https://github.com/thomascamminady/camminady_altair_theme"
Issues = "https://github.com/thomascamminady/camminady_altair_theme/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "regex>=2024.11.6",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "rich>=13.9.4",
    "ruff>=0.14.3",
    "ty>=0.0.1a25",
    "vega-datasets>=0.9.0",
    "vl-convert-python>=1.9.0.post1",
]
docs = [
    "pdoc>=14.0.0",
]

[project.entry-points.'altair.vegalite.v6.theme']
camminady = "camminady_altair_theme.theme:camminady"
camminady_dark = "camminady_altair_theme.theme:camminady_dark"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.MASTER]
disable=[
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
]

[tool.pyright]
exclude = [
    ".venv/*",
    ".mypy_cache/*",
    ".pytest_cache/*",
    ".ruff_cache/*",
    ".ipynb_checkpoints/*",
    ".git/*",
    ".github/*",
    "**/__pycache__/*",
    "**/*.pyc",
]
