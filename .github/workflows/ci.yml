name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, type check and test (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --no-fix .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen ty check

      - name: Test
        run: uv run --frozen pytest

  compatibility:
    name: Test (Python ${{ matrix.python }}, altair${{ matrix.altair }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.11", "3.12", "3.13", "3.14" ]
        altair: [ "==6.0.0", ">=6" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Test against the oldest and the newest supported altair
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python }}
          --with-editable . --with "altair${{ matrix.altair }}"
          --with pytest --with vl-convert-python
          python -m pytest
