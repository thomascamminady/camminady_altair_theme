# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # This is a library: update uv.lock only and never raise the lower bounds
    # in pyproject.toml (the "pip" ecosystem bumped e.g. altair>=6.0.0 to
    # altair>=6.2.2 without touching uv.lock).
    versioning-strategy: "lockfile-only"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "ci"
